# Les routes de Télémarché, gérées par l'équipe applicative dans SON namespace,
# et rattachées au Gateway « entree » de l'exploitant.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: telemarche
  labels:
    app.kubernetes.io/part-of: telemarche
spec:
  parentRefs:
    - name: entree
      namespace: traefik
  hostnames:
    - telemarche.local
  rules:
    # 1. Les testeurs (en-tête X-Canari: oui) voient toujours la nouvelle API.
    - matches:
        - path:
            type: PathPrefix
            value: /api
          headers:
            - name: X-Canari
              value: oui
      backendRefs:
        - name: api-canari
          port: 80
    # 2. Les autres appels à l'API : 90 % vers la version stable, 10 % vers la canari.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 80
          weight: 90
        - name: api-canari
          port: 80
          weight: 10
    # 3. Tout le reste : la vitrine.
    - backendRefs:
        - name: web
          port: 80
