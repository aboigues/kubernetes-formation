name: Weekly Image Vulnerability Scan

# Scanne les CVE des images de conteneurs utilisées dans les manifests des TPs.
# Complémentaire du job "security-scan" de test-kubernetes-manifests.yml, qui
# lui analyse les misconfigurations des manifests (trivy config), pas les images.
#
# Sécurité chaîne d'appro : on N'utilise PAS `aquasecurity/trivy-action` ni
# `aquasecurity/setup-trivy` (compromises en 2025, release malveillante v0.69.4).
# On lance l'image officielle `aquasec/trivy` épinglée, comme docker-formation ;
# seule l'action first-party `github/codeql-action/upload-sarif` est utilisée.

on:
  schedule:
    # Tous les lundis à 04:00 UTC (GitHub Actions n'accepte que l'UTC),
    # soit 05:00 à Paris en hiver et 06:00 en été.
    - cron: '0 4 * * 1'
  workflow_dispatch:
  # Sur modification du scan lui-même, pour le valider avant le lundi suivant.
  push:
    branches: [ main, claude/** ]
    paths:
      - '.github/workflows/scan-images.yml'
      - '.github/scripts/extract-images.py'
      - '.github/scripts/image-scan-report.py'
      - '.github/scripts/test_extract_images.py'
      - '.github/image-scan-ignore.txt'

permissions:
  contents: read

env:
  # Seuil de blocage, partagé par le gate de chaque image et par le rapport final.
  #
  # ⚠️ Partager la gravité ne suffit pas : les deux doivent aussi porter sur le même
  # PÉRIMÈTRE (paquets OS, correctif publié), sinon ils divergent. C'est arrivé :
  # le rapport comptait toutes les CVE et sortait en échec alors que toutes les
  # images étaient vertes — exactement ce que cette variable prétendait empêcher.
  FAIL_ON_SEVERITY: 'CRITICAL,HIGH'

jobs:
  list-images:
    name: List Images to Scan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.extract.outputs.matrix }}
      count: ${{ steps.extract.outputs.count }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      # Un calcul de catégorie faux brouillerait l'onglet Security sans bruit
      # (uploads écrasés, alertes fantômes) : on le vérifie avant chaque scan.
      - name: Tests du calcul des catégories SARIF
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Extract container images from manifests
        id: extract
        run: |
          matrix=$(python3 .github/scripts/extract-images.py --matrix)
          count=$(echo "$matrix" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

          echo "$count image(s) à scanner :"
          python3 .github/scripts/extract-images.py --verbose

          if [ "$count" -eq 0 ]; then
            echo "❌ Aucune image trouvée : l'extraction est probablement cassée."
            exit 1
          fi

  scan-image:
    name: Scan ${{ matrix.image }}
    needs: list-images
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      # Limité pour rester sous les quotas de pull anonymes des registres publics.
      max-parallel: 5
      matrix:
        include: ${{ fromJson(needs.list-images.outputs.matrix) }}

    steps:
      # Nécessaire au seul .trivyignore.yaml lu par la barrière en fin de job.
      # Sans checkout, le fichier n'existe pas sur le runner et Trivy l'ignore en
      # silence : les exceptions ne s'appliqueraient pas, sans la moindre erreur.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan image with Trivy (SARIF)
        env:
          # Évite le rate-limiting GitHub lors du téléchargement de la base Trivy.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GITHUB_TOKEN \
            -v "$PWD:/out" -v "$PWD/.trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.72.0 image \
            --severity CRITICAL,HIGH \
            --format sarif --output "/out/trivy-${{ matrix.slug }}.sarif" \
            --timeout 15m \
            --no-progress \
            "${{ matrix.image }}"

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        # Si le scan a échoué (image introuvable...), le fichier SARIF n'existe pas :
        # tenter l'upload ne ferait qu'ajouter une erreur parasite au vrai échec.
        if: success()
        with:
          sarif_file: 'trivy-${{ matrix.slug }}.sarif'
          # Une catégorie par image (sinon chaque upload écraserait le précédent),
          # STABLE (sans tag) : une montée de version ferme les alertes corrigées au
          # lieu de les laisser ouvertes à vie sous l'ancien tag. Voir
          # categories_sarif() dans .github/scripts/extract-images.py.
          category: ${{ matrix.categorie }}

      # L'image est déjà dans le cache Trivy du premier scan : ce second
      # passage ne la retélécharge pas.
      - name: Scan image with Trivy (JSON pour le rapport)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GITHUB_TOKEN \
            -v "$PWD:/out" -v "$PWD/.trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.72.0 image \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --format json --output "/out/trivy-${{ matrix.slug }}.json" \
            --timeout 15m \
            --no-progress \
            "${{ matrix.image }}"

      - name: Upload JSON report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ matrix.slug }}
          path: 'trivy-${{ matrix.slug }}.json'
          retention-days: 30

      # BARRIÈRE : seules les CVE de paquets OS AVEC UN CORRECTIF PUBLIÉ font
      # rougir le job. Autrement dit : le rouge signifie « il y a quelque chose à
      # faire », jamais « il existe une CVE ».
      #
      # Deux filtres complémentaires, et l'ordre du raisonnement compte :
      #
      # 1. --pkg-types os — une CVE de binaire (gobinary, jar...) ne part que si
      #    l'amont recompile. Mesuré : 33 images rouges avec toutes les CVE, dont
      #    12 n'ont QUE des CVE de binaires Go. Elles sont en plus largement non
      #    atteignables (un binaire qui n'appelle jamais net/http embarque quand
      #    même les CVE de la stdlib), et leur nombre suit l'âge du build, pas le
      #    risque : ~5-6 nouvelles par mois sans que rien ne change dans l'image.
      #
      # 2. --ignore-unfixed — une fois restreint aux paquets OS, « corrigeable »
      #    veut enfin dire « applicable » : soit en montant le tag, soit par un
      #    apk/apt upgrade (cf. docker/hardened/). Sans ce filtre, la barrière est
      #    rouge à vie sur wordpress (156 CVE), cassandra (45) et fluentd (21), qui
      #    n'ont AUCUN correctif publié : une alarme permanente qu'on finit par
      #    ignorer, et qui masque les vraies.
      #
      # ⚠️ AUTOMATION.md rejetait --ignore-unfixed. Ce rejet visait une barrière
      # TOUTES CATÉGORIES, où il aurait retenu des CVE de binaires « corrigeables »
      # mais inapplicables. Appliqué APRÈS le filtre OS, il n'a plus ce défaut.
      #
      # Rien n'est masqué durablement : une CVE sans correctif aujourd'hui
      # redevient bloquante le jour où la distribution en publie un — sans liste
      # à maintenir. Et le scan complet ci-dessus a déjà tout envoyé dans l'onglet
      # Security, où il reste consultable pour jugement humain.
      #
      # L'étape est en dernier : le SARIF et le JSON sont déjà uploadés, donc rien
      # n'est perdu au moment précis où il y a quelque chose à voir. L'image est en
      # cache depuis le premier scan, ce passage ne la retélécharge pas.
      #
      # --ignorefile : exceptions documentées et datées. Volontairement absent des
      # étapes de scan ci-dessus : une exception lève le blocage, elle n'efface pas
      # la CVE de l'onglet Security. Le fichier doit exister (checkout en tête de
      # job) : absent, Trivy l'ignorerait en silence.
      - name: Fail on fixable OS package vulnerabilities
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -f .trivyignore.yaml
          docker run --rm -e GITHUB_TOKEN \
            -v "$PWD:/src:ro" -v "$PWD/.trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.72.0 image \
            --severity "$FAIL_ON_SEVERITY" \
            --scanners vuln \
            --pkg-types os \
            --ignore-unfixed \
            --ignorefile /src/.trivyignore.yaml \
            --exit-code 1 \
            --timeout 15m \
            --no-progress \
            "${{ matrix.image }}"

  report:
    name: Vulnerability Report
    needs: [ list-images, scan-image ]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Le rapport lit .trivyignore.yaml pour appliquer les mêmes exceptions que la
      # barrière. Sans pyyaml il ne planterait pas : il ignorerait les exceptions et
      # rendrait un verdict divergent.
      - name: Install dependencies
        run: pip install pyyaml

      - name: Download all scan reports
        uses: actions/download-artifact@v4
        with:
          pattern: trivy-report-*
          path: reports
          merge-multiple: true

      - name: Build summary
        run: |
          # --fail-on rend le scan bloquant. Le code de sortie est mis de côté le
          # temps d'écrire le résumé complet, sinon `set -e` couperait le rapport
          # au moment précis où il a quelque chose à dire.
          set +e
          python3 .github/scripts/image-scan-report.py reports \
            --fail-on "$FAIL_ON_SEVERITY" >> "$GITHUB_STEP_SUMMARY"
          report_status=$?
          set -e

          scanned=$(find reports -name '*.json' | wc -l)
          expected=${{ needs.list-images.outputs.count }}
          if [ "$scanned" -lt "$expected" ]; then
            {
              echo ""
              echo "> ⚠️ $scanned/$expected image(s) scannée(s) : certains scans ont échoué,"
              echo "> voir les jobs en erreur."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit $report_status
