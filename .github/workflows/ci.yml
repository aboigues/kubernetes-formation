name: TP — vérification

# « Si ce n'est pas testé par GitHub Actions, ça ne fonctionne pas. »
# Chaque TP est validé en exécutant son verify.sh sur la solution de référence,
# dans un vrai cluster minikube identique au lab (containerd, Kubernetes 1.37).
#
# Matrice DYNAMIQUE : on ne rejoue que les TP modifiés par le commit. Un
# changement PARTAGÉ (scripts/, apps/telemarche/ ou ce workflow) relance TOUS les
# TP, puisqu'il peut tous les casser.
#
# Sécurité chaîne d'appro : pas d'action aquasecurity/* (compromises en 2025) ;
# Trivy et kubeconform tournent depuis leurs images officielles, épinglées.

on:
  push:
    branches: [main]
    paths:
      - "tp[0-9][0-9]-*/**"
      - "scripts/**"
      - "apps/telemarche/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "tp[0-9][0-9]-*/**"
      - "scripts/**"
      - "apps/telemarche/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  KUBERNETES_VERSION: v1.37.1
  MINIKUBE_VERSION: 1.39.0
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0
  # Helm 4 (les runners n'ont que Helm 3) : binaire officiel, checksum FIGÉ ici
  # plutôt que téléchargé à côté de l'archive, qui ne prouverait rien.
  HELM_VERSION: v4.3.1
  HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b

jobs:
  # 1) Déterminer la liste des TP à tester à partir des fichiers modifiés.
  select:
    runs-on: ubuntu-latest
    outputs:
      tps: ${{ steps.pick.outputs.tps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Source de vérité : tout dossier tpNN-thème muni d'un verify.sh.
          # (Le bit exécutable est contrôlé par le job lint, pas ici.)
          CANON=""
          for d in tp[0-9][0-9]-*/; do
            d="${d%/}"
            # .ci-statique : TP sans cluster possible en CI (kubeadm demande des
            # machines) ; seuls les contrôles statiques du job lint s'y appliquent.
            if [ -f "$d/.ci-statique" ]; then echo "$d : contrôles statiques seulement ($(cat "$d/.ci-statique"))"; continue; fi
            if [ -f "$d/verify.sh" ]; then CANON="$CANON $d"; fi
          done

          to_json() {
            if [ "$#" -eq 0 ]; then printf '[]'; else printf '%s\n' "$@" | jq -R . | jq -cs .; fi
          }

          CHANGED=""
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=200 origin "$BASE_REF" >/dev/null 2>&1 || true
            CHANGED="$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null || true)"
          elif [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$BEFORE" "$SHA" 2>/dev/null || true)"
          fi

          if [ -z "$CHANGED" ] || printf '%s\n' "$CHANGED" \
               | grep -qE '^(scripts/|apps/telemarche/|\.github/workflows/ci\.yml$)'; then
            TPS="$(to_json $CANON)"
          else
            SEL=""
            for tp in $(printf '%s\n' "$CHANGED" | grep -oE '^tp[0-9]{2}-[^/]+' | sort -u); do
              case " $CANON " in *" $tp "*) SEL="$SEL $tp" ;; esac
            done
            TPS="$(to_json $SEL)"
          fi
          echo "tps=$TPS" >> "$GITHUB_OUTPUT"
          echo "TP sélectionnés pour ce run : $TPS"

  # 2) Contrôles statiques, sans cluster : rapides, ils échouent avant les longs.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Helm ${{ env.HELM_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          rm -rf helm.tgz linux-amd64
          helm version --short

      - name: Chaque starter contient des trous, chaque solution n'en contient aucun
        run: |
          set -euo pipefail
          rc=0
          for tp in tp[0-9][0-9]-*/; do
            tp="${tp%/}"
            [ -x "$tp/verify.sh" ] || { echo "::error::$tp : verify.sh absent ou non exécutable"; rc=1; continue; }
            if [ -d "$tp/starter" ] && ! grep -rq '______' "$tp/starter"; then
              echo "::error::$tp/starter ne contient aucun trou « ______ »"; rc=1
            fi
            if grep -rn '______' "$tp/solution" 2>/dev/null; then
              echo "::error::$tp/solution contient encore des trous"; rc=1
            fi
          done
          exit $rc

      - name: Aucun manifeste ne fixe metadata.namespace
        # verify.sh déploie dans un namespace jetable : un namespace écrit en dur
        # ferait échouer l'apply (ou pire, viserait le namespace du stagiaire).
        run: |
          set -euo pipefail
          if grep -rnE '^  namespace:' tp[0-9][0-9]-*/{starter,solution,pannes,outils} 2>/dev/null; then
            echo "::error::metadata.namespace interdit dans les manifestes des TP"; exit 1
          fi

      - name: Schémas Kubernetes (kubeconform, ${{ env.KUBERNETES_VERSION }})
        run: |
          set -euo pipefail
          dirs=$(ls -d tp[0-9][0-9]-*/solution tp[0-9][0-9]-*/pannes tp[0-9][0-9]-*/outils 2>/dev/null | xargs)
          # Les CRD (Gateway API…) sont validées par le catalogue communautaire de schémas.
          docker run --rm -v "$PWD":/w:ro -w /w "$KUBECONFORM_IMAGE" \
            -strict -summary -kubernetes-version "${KUBERNETES_VERSION#v}" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -skip InitConfiguration,ClusterConfiguration,JoinConfiguration,KubeletConfiguration \
            -ignore-filename-pattern '/templates/' -ignore-filename-pattern 'Chart\.yaml$' \
            -ignore-filename-pattern '/values[^/]*\.yaml$' \
            $dirs

      - name: Charts Helm (helm lint, puis rendu validé par kubeconform)
        # Les templates ne sont pas du YAML : on valide ce qu'ils produisent, avec
        # les values par défaut puis chaque fichier values-*.yaml du chart.
        run: |
          set -euo pipefail
          shopt -s nullglob
          for chart in tp[0-9][0-9]-*/solution/*/Chart.yaml; do
            dir="$(dirname "$chart")"
            echo "== $dir"
            helm lint "$dir"
            for v in "" "$dir"/values-*.yaml; do
              echo "-- values : ${v:-défaut}"
              helm template rendu "$dir" ${v:+-f "$v"} \
                | docker run --rm -i "$KUBECONFORM_IMAGE" -strict -summary \
                    -kubernetes-version "${KUBERNETES_VERSION#v}" -
            done
          done

      - name: Configurations kubeadm (kubeadm config validate, ${{ env.KUBERNETES_VERSION }})
        # Sans schéma pour kubeconform : on les fait valider par kubeadm lui-même.
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tp[0-9][0-9]-*/solution/kubeadm-config*.yaml)
          [ "${#files[@]}" -gt 0 ] || { echo "aucune"; exit 0; }
          curl -fsSLo kubeadm "https://dl.k8s.io/release/${KUBERNETES_VERSION}/bin/linux/amd64/kubeadm"
          chmod +x kubeadm
          for f in "${files[@]}"; do echo "== $f"; ./kubeadm config validate --config "$f"; done

      - name: Sécurité des manifestes (trivy config, 0 HIGH/CRITICAL)
        # Trivy n'accepte qu'une cible : on rassemble ce qui est réellement
        # déployé (solution, pannes, outils), sans les starters à trous.
        run: |
          set -euo pipefail
          SCAN="$(mktemp -d)"
          for d in tp[0-9][0-9]-*/solution tp[0-9][0-9]-*/pannes tp[0-9][0-9]-*/outils; do
            [ -d "$d" ] && mkdir -p "$SCAN/$(dirname "$d")" && cp -r "$d" "$SCAN/$d"
          done
          docker run --rm -v "$SCAN":/scan:ro "$TRIVY_IMAGE" config \
            --quiet --severity HIGH,CRITICAL --exit-code 1 /scan

      - name: Scripts shell (shellcheck)
        run: |
          set -euo pipefail
          shopt -s nullglob   # un motif sans fichier disparaît au lieu d'être passé tel quel
          shellcheck -x -S warning scripts/*.sh tp[0-9][0-9]-*/*.sh \
            tp[0-9][0-9]-*/solution/*.sh tp[0-9][0-9]-*/outils/*.sh

  # 3) Rejouer verify.sh solution dans un cluster neuf, un TP par job.
  tp:
    needs: [select, lint]
    if: ${{ needs.select.outputs.tps != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tp: ${{ fromJson(needs.select.outputs.tps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Cluster minikube ${{ env.MINIKUBE_VERSION }} / Kubernetes ${{ env.KUBERNETES_VERSION }}
        uses: medyagh/setup-minikube@v0.0.21
        with:
          minikube-version: ${{ env.MINIKUBE_VERSION }}
          kubernetes-version: ${{ env.KUBERNETES_VERSION }}
          # minikube 1.39.0 ne connaît Kubernetes que jusqu'à 1.37.0 : pour 1.37.1, il
          # vérifie la version auprès de l'API GitHub, sans jeton (client anonyme dans
          # son code, GITHUB_TOKEN n'y change rien). Les runners partagent leur IP et
          # épuisent la limite anonyme : « 403 API rate limit exceeded ». --force
          # poursuit malgré l'échec de cette vérification. À retirer quand minikube
          # connaîtra la version visée.
          start-args: --force
          driver: docker
          container-runtime: containerd
          # kindnet (le défaut) n'applique pas les NetworkPolicies : Calico pour le TP11.
          cni: ${{ startsWith(matrix.tp, 'tp11-') && 'calico' || 'auto' }}
          cpus: max
          memory: max

      - name: Helm ${{ env.HELM_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          rm -rf helm.tgz linux-amd64
          helm version --short

      - name: Prérequis du cluster — ${{ matrix.tp }}
        # Addons, contrôleurs ou nœuds supplémentaires qu'un TP fait installer
        # dans son README (metrics-server, Traefik, nœuds…) : scriptés dans
        # prerequis.sh. AVANT le chargement des images, pour que les nœuds
        # ajoutés reçoivent aussi celles de la PR.
        run: |
          if [ -x "${{ matrix.tp }}/prerequis.sh" ]; then ./${{ matrix.tp }}/prerequis.sh; else echo "aucun"; fi

      # Les images du fil rouge sont construites depuis les sources de la PR et
      # chargées dans le cluster : on teste le code de la PR, pas ce qui est
      # publié sur Docker Hub.
      - name: Images Télémarché (1.0 et 1.1)
        working-directory: apps/telemarche
        run: |
          set -euo pipefail
          for v in 1.0 1.1; do
            for t in api web; do
              docker build -q --target "$t" --build-arg VERSION="$v" -t "telemachlearning/telemarche-$t:$v" .
            done
          done
          minikube image load \
            telemachlearning/telemarche-api:1.0 telemachlearning/telemarche-api:1.1 \
            telemachlearning/telemarche-web:1.0 telemachlearning/telemarche-web:1.1

      - name: verify.sh solution — ${{ matrix.tp }}
        run: ./${{ matrix.tp }}/verify.sh solution

      - name: verify.sh starter doit échouer — ${{ matrix.tp }}
        # Un starter qui passerait la vérification ne laisserait rien à faire.
        run: |
          if ./${{ matrix.tp }}/verify.sh starter; then
            echo "::error::le starter de ${{ matrix.tp }} passe verify.sh : il ne laisse rien à compléter"; exit 1
          fi

      - name: État du cluster en cas d'échec
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get all -A || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -40 || true
