name: Test Kubernetes Manifests

# ANCIENNE GÉNÉRATION (v1) : les dossiers « tpNN » (il ne reste que tp10/), retirés un à
# un par la refonte. Les TP v2 (« tpNN-thème ») sont validés par ci.yml, de façon
# bloquante : schémas stricts, trivy config, verify.sh sur un vrai cluster.
# Les boucles ci-dessous découvrent les dossiers v1 restants par motif : un
# dossier supprimé disparaît de lui-même, sans liste à tenir à jour.

on:
  push:
    branches: [ main, claude/** ]
    paths:
      - 'tp*/**/*.yaml'
      - 'tp*/**/*.yml'
      - 'tp*/**/*.sh'
      - 'tp*/**/Dockerfile'
      - 'docker/hardened/**'
      - 'docs/**/*.yaml'
      - 'docs/**/*.yml'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'tp*/**/*.yaml'
      - 'tp*/**/*.yml'
      - 'tp*/**/*.sh'
      - 'tp*/**/Dockerfile'
      - 'docker/hardened/**'
      - 'docs/**/*.yaml'
      - 'docs/**/*.yml'
      - '.github/workflows/**'

jobs:
  validate-yaml-syntax:
    name: Validate YAML Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint

      - name: Create yamllint config
        run: |
          cat > .yamllint.yml << 'EOF'
          extends: default
          rules:
            line-length:
              max: 120
              level: warning
            indentation:
              spaces: 2
            comments:
              min-spaces-from-content: 1
            document-start: disable
          EOF

      - name: Run yamllint on all TPs
        run: |
          echo "Validating YAML files in all TPs and docs..."
          shopt -s nullglob
          for tp in tp[0-9][0-9] docs; do   # v1 seulement (la v2, tpNN-thème, est dans ci.yml)
            if [ -d "$tp" ]; then
              echo "Validating YAML files in $tp/"
              if compgen -G "$tp/*.yaml" > /dev/null; then
                yamllint -c .yamllint.yml $tp/*.yaml || true
              fi
              # Also check subdirectories for docs
              if [ "$tp" = "docs" ]; then
                find docs -type f \( -name "*.yaml" -o -name "*.yml" \) -exec yamllint -c .yamllint.yml {} + 2>/dev/null || true
              fi
            fi
          done

  check-deprecated-apis:
    name: Check for Deprecated Kubernetes APIs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for deprecated APIs
        run: |
          echo "Checking for deprecated Kubernetes APIs..."
          deprecated=0

          # Find all YAML files in TPs and docs
          yaml_files=$(find tp*/ docs/ -name "*.yaml" -o -name "*.yml" 2>/dev/null | grep -v node_modules || true)

          echo "Scanning $(echo "$yaml_files" | wc -l) YAML files..."
          echo ""

          # Check each file for deprecated APIs
          for file in $yaml_files; do
            file_has_issues=0

            # Check for removed APIs
            if grep -q "apiVersion: extensions/v1beta1" "$file" 2>/dev/null; then
              echo "❌ $file: extensions/v1beta1 is REMOVED (use apps/v1)"
              file_has_issues=1
            fi

            if grep -q "apiVersion: apps/v1beta1" "$file" 2>/dev/null; then
              echo "❌ $file: apps/v1beta1 is REMOVED (use apps/v1)"
              file_has_issues=1
            fi

            if grep -q "apiVersion: apps/v1beta2" "$file" 2>/dev/null; then
              echo "❌ $file: apps/v1beta2 is REMOVED (use apps/v1)"
              file_has_issues=1
            fi

            # Check for deprecated APIs
            if grep -q "apiVersion: policy/v1beta1" "$file" 2>/dev/null; then
              echo "⚠️  $file: policy/v1beta1 is deprecated (use policy/v1)"
              file_has_issues=1
            fi

            if grep -q "apiVersion: autoscaling/v2beta1" "$file" 2>/dev/null; then
              echo "⚠️  $file: autoscaling/v2beta1 is deprecated (use autoscaling/v2)"
              file_has_issues=1
            fi

            if grep -q "apiVersion: autoscaling/v2beta2" "$file" 2>/dev/null; then
              echo "⚠️  $file: autoscaling/v2beta2 is deprecated (use autoscaling/v2)"
              file_has_issues=1
            fi

            if grep -q "apiVersion: batch/v1beta1" "$file" 2>/dev/null; then
              echo "⚠️  $file: batch/v1beta1 CronJob is deprecated (use batch/v1)"
              file_has_issues=1
            fi

            if grep -q "apiVersion: networking.k8s.io/v1beta1" "$file" 2>/dev/null; then
              echo "⚠️  $file: networking.k8s.io/v1beta1 is deprecated (use networking.k8s.io/v1)"
              file_has_issues=1
            fi

            if [ $file_has_issues -eq 1 ]; then
              ((deprecated++))
            fi
          done

          echo ""
          if [ $deprecated -eq 0 ]; then
            echo "✅ No deprecated APIs found - all manifests are up-to-date!"
          else
            echo "⚠️  Found $deprecated file(s) with deprecated or removed APIs"
            echo "Please update these files to use current API versions"
            # Don't fail the build, just warn
            # exit 1
          fi

  validate-kubernetes-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.32.0'

      - name: Install kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/download/v0.6.6/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Validate all TP manifests with kubeconform
        run: |
          echo "Validating all Kubernetes manifests with kubeconform..."
          shopt -s nullglob
          for tp in tp[0-9][0-9] docs; do   # v1 seulement (la v2, tpNN-thème, est dans ci.yml)
            if [ -d "$tp" ]; then
              echo ""
              echo "=== Validating $tp ==="
              # Validate root level YAML files
              for file in $tp/*.yaml; do
                [ -f "$file" ] || continue
                echo "Validating $file"
                kubeconform -summary -output json "$file" || echo "Warning: $file has validation issues"
              done
              # Also check subdirectories for docs
              if [ "$tp" = "docs" ]; then
                find docs -type f \( -name "*.yaml" -o -name "*.yml" \) -print0 | while IFS= read -r -d '' file; do
                  echo "Validating $file"
                  kubeconform -summary -output json "$file" || echo "Warning: $file has validation issues"
                done
              fi
            fi
          done

      - name: Validate all TP manifests with kubectl dry-run
        run: |
          echo "Testing kubectl dry-run on all manifests..."
          shopt -s nullglob
          for tp in tp[0-9][0-9] docs; do   # v1 seulement (la v2, tpNN-thème, est dans ci.yml)
            if [ -d "$tp" ]; then
              echo ""
              echo "=== Dry-run validation for $tp ==="
              # Validate root level YAML files
              for file in $tp/*.yaml; do
                [ -f "$file" ] || continue
                echo "Dry-run: $file"
                kubectl apply --dry-run=client -f "$file" || echo "Warning: $file failed dry-run"
              done
              # Also check subdirectories for docs
              if [ "$tp" = "docs" ]; then
                find docs -type f \( -name "*.yaml" -o -name "*.yml" \) -print0 | while IFS= read -r -d '' file; do
                  echo "Dry-run: $file"
                  kubectl apply --dry-run=client -f "$file" || echo "Warning: $file failed dry-run"
                done
              fi
            fi
          done

  test-tp10-synthesis:
    name: Test TP10 - Synthesis Project (TaskFlow)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Minikube
        uses: medyagh/setup-minikube@latest
        with:
          kubernetes-version: 'v1.32.0'
          cpus: 4
          memory: 4096

      - name: Enable metrics-server
        run: |
          minikube addons enable metrics-server
          kubectl wait --for=condition=ready pod -l k8s-app=metrics-server -n kube-system --timeout=120s

      - name: Verify Minikube
        run: |
          kubectl version --client
          kubectl cluster-info
          kubectl get nodes

      - name: Create namespace
        run: kubectl create namespace taskflow

      # 09b-backend-deployment.yaml référence taskflow-backend:latest avec
      # imagePullPolicy: Never - l'image doit donc exister dans le cache
      # d'images de CE minikube avant le déploiement, pas juste être buildable
      # (le job "Build TP Dockerfiles" la construit bien, mais sous un autre
      # tag - tp10-backend:ci - et sur un runner totalement différent, donc
      # invisible ici). `minikube image build` construit directement dans le
      # cache du cluster, sans dépendre du driver (docker/none/...).
      - name: Build TaskFlow backend image inside Minikube
        run: minikube image build -t taskflow-backend:latest tp10/

      - name: Deploy TP10 resources
        run: |
          echo "Deploying PostgreSQL..."
          kubectl apply -f tp10/01-postgres-init-script.yaml
          kubectl apply -f tp10/02-postgres-secret.yaml
          kubectl apply -f tp10/03-postgres-pvc.yaml
          kubectl apply -f tp10/04-postgres-deployment.yaml
          kubectl apply -f tp10/05-postgres-service.yaml

          echo "Deploying Redis..."
          kubectl apply -f tp10/06-redis-deployment.yaml
          kubectl apply -f tp10/07-redis-service.yaml

          echo "Deploying Backend API..."
          kubectl apply -f tp10/08-backend-config.yaml
          kubectl apply -f tp10/09a-backend-app-code.yaml
          kubectl apply -f tp10/09b-backend-deployment.yaml
          kubectl apply -f tp10/10-backend-service.yaml
          kubectl apply -f tp10/11-backend-hpa.yaml

          echo "Deploying Frontend..."
          kubectl apply -f tp10/12a-frontend-config.yaml
          kubectl apply -f tp10/12b-frontend-nginx-config.yaml
          kubectl apply -f tp10/13-frontend-deployment.yaml
          kubectl apply -f tp10/14-frontend-service.yaml

          echo "Deploying Prometheus..."
          kubectl apply -f tp10/15-prometheus-config.yaml
          kubectl apply -f tp10/16-prometheus-rbac.yaml
          kubectl apply -f tp10/17-prometheus-pvc.yaml
          kubectl apply -f tp10/18-prometheus-deployment.yaml
          kubectl apply -f tp10/19-prometheus-service.yaml

          echo "Deploying Grafana..."
          kubectl apply -f tp10/20a-grafana-datasource.yaml
          kubectl apply -f tp10/20b-grafana-deployment.yaml
          kubectl apply -f tp10/21-grafana-service.yaml
          kubectl apply -f tp10/24-grafana-dashboard-configmap.yaml
          kubectl apply -f tp10/25-grafana-dashboard-provider.yaml

      - name: Wait for pods to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          kubectl wait --for=condition=ready pod -l app=postgres -n taskflow --timeout=180s

          echo "Waiting for Redis..."
          kubectl wait --for=condition=ready pod -l app=redis -n taskflow --timeout=120s

          echo "Waiting for Backend API..."
          kubectl wait --for=condition=ready pod -l app=backend-api -n taskflow --timeout=180s

          echo "Waiting for Frontend..."
          kubectl wait --for=condition=ready pod -l app=frontend -n taskflow --timeout=120s

      - name: Make test script executable
        run: chmod +x tp10/test-tp10.sh

      - name: Run TP10 synthesis tests
        run: |
          cd tp10
          ./test-tp10.sh

      - name: Display pod status
        if: always()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n taskflow
          echo ""
          echo "=== HPA Status ==="
          kubectl get hpa -n taskflow
          echo ""
          echo "=== PVC Status ==="
          kubectl get pvc -n taskflow

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== PostgreSQL logs ==="
          kubectl logs -l app=postgres -n taskflow --tail=50 || true
          echo ""
          echo "=== Backend API logs ==="
          kubectl logs -l app=backend-api -n taskflow --tail=50 || true
          echo ""
          echo "=== Redis logs ==="
          kubectl logs -l app=redis -n taskflow --tail=50 || true

      - name: Cleanup TP10 resources
        if: always()
        run: |
          kubectl delete namespace taskflow --ignore-not-found=true --timeout=60s || true

  lint-readme:
    name: Lint README Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README files exist
        run: |
          echo "Checking README files..."
          for tp in tp[0-9][0-9] tp[0-9][0-9]-*; do
            if [ -f "$tp/README.md" ]; then
              echo "✓ $tp/README.md exists ($(wc -l < "$tp/README.md") lines)"
            else
              echo "⚠️ $tp/README.md missing"
            fi
          done

      - name: Check for broken links
        run: |
          echo "Checking for common markdown issues..."
          # Check for unclosed code blocks
          for readme in tp*/README.md README.md; do
            if [ -f "$readme" ]; then
              backticks=$(grep -c '```' "$readme" || true)
              if [ $((backticks % 2)) -ne 0 ]; then
                echo "Warning: $readme may have unclosed code blocks"
              else
                echo "✓ $readme: code blocks look good"
              fi
            fi
          done

  build-dockerfiles:
    name: Build TP Dockerfiles
    runs-on: ubuntu-latest
    # Les Dockerfiles déclenchaient déjà ce workflow (voir `paths` plus haut) mais
    # aucun job ne les construisait : tp06/sample-app était cassé depuis longtemps
    # (npm ci sans package-lock.json) sans que rien ne le signale.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build tp10 TaskFlow backend
        run: docker build -t tp10-backend:ci tp10/

      - name: Verify images run as non-root
        run: |
          for img in tp10-backend:ci; do
            uid=$(docker run --rm "$img" id -u)
            echo "$img -> uid $uid"
            if [ "$uid" = "0" ]; then
              echo "❌ $img tourne en root"
              exit 1
            fi
          done

      - name: Verify tp10 dependencies import
        # psycopg2-binary dépend d'une wheel musllinux sur Alpine : si la version de
        # Python monte au-delà de ce que couvre requirements.txt, l'import casse ici.
        run: |
          docker run --rm tp10-backend:ci \
            python -c "import psycopg2, flask, redis, prometheus_client; print('imports OK')"

      - name: Build hardened hpa-example
        run: docker build -t hpa-example:ci docker/hardened/hpa-example/

      - name: Verify hpa-example serves and burns CPU
        # La charge CPU est le contrat de cette image : sans elle le HPA n'a rien à
        # mesurer et la démo des TP4/TP9 ne scale pas. Une régression de calibration
        # (ou une boucle éliminée par le compilateur) est invisible à la lecture.
        run: |
          docker run --rm -d --name hpa -p 8080:8080 hpa-example:ci
          sleep 2

          body=$(curl -s -m 60 localhost:8080)
          if [ "$body" != "OK!" ]; then
            echo "❌ réponse inattendue : '$body'"
            exit 1
          fi

          # Une requête doit coûter un temps CPU significatif (~300 ms attendus).
          start=$(date +%s%N)
          curl -s -m 60 -o /dev/null localhost:8080
          elapsed=$(( ($(date +%s%N) - start) / 1000000 ))
          echo "durée d'une requête : ${elapsed} ms"

          if [ "$elapsed" -lt 50 ]; then
            echo "❌ trop rapide : la boucle de charge ne s'exécute plus"
            exit 1
          fi

          docker rm -f hpa

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        # Épinglée, comme dans scan-images.yml : @master fait dépendre la CI de ce que
        # l'amont pousse le jour même.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          # ⚠️ `severity` ne filtre QUE l'affichage : sans limit-severities-for-sarif,
          # le SARIF contient toutes les sévérités et l'onglet Security reçoit
          # 1981 alertes au lieu de 261 — 1419 LOW et 301 MEDIUM que ce job ne
          # prétend pas surveiller. C'est ainsi qu'un DS-0026 (LOW, « pas de
          # HEALTHCHECK ») s'est retrouvé signalé sur une PR.
          limit-severities-for-sarif: true
          # Exceptions aux misconfigurations. Fichier SÉPARÉ de .trivyignore.yaml,
          # qui couvre les CVE d'images et n'est lu que par la barrière du scan
          # hebdomadaire : deux régimes, deux périmètres, deux règles d'expiration.
          #
          # Contrairement au scan d'images, ce job n'a PAS de barrière (exit-code 0) :
          # il ne fait qu'alimenter l'onglet Security. L'exception agit donc bien sur
          # ce qui est rapporté — sans quoi elle n'aurait aucun effet. N'y entre que
          # ce dont le respect supprimerait la notion enseignée par le fichier.
          trivyignores: '.trivyignore-manifests.yaml'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
