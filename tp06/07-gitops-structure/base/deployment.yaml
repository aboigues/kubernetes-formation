apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101       # nginx
        fsGroup: 101         # rend les emptyDir ci-dessous inscriptibles par nginx
        seccompProfile:
          type: RuntimeDefault
        # nginx écoute sur le port 80 alors qu'il tourne en non-root sans aucune
        # capability. Le runtime docker autorise ce bind par défaut, containerd
        # (microk8s, minikube récent) non : sans ce sysctl, CrashLoopBackOff sur
        # "bind() to 0.0.0.0:80 failed (13: Permission denied)". Sysctl "safe",
        # autorisé par défaut depuis Kubernetes 1.22.
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      containers:
      - name: app
        image: nginx:alpine
        ports:
        - containerPort: 80
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        # nginx écrit son cache et son PID au démarrage : sans ces volumes il
        # refuse de démarrer en racine lecture seule.
        - name: cache
          mountPath: /var/cache/nginx
        - name: run
          mountPath: /var/run
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: cache
        emptyDir: {}
      - name: run
        emptyDir: {}
