# Exercice 8 (README, section 5.3) : prêt à l'emploi, aucune modification requise.
# Déploie l'overlay dev de tp06/07-gitops-structure depuis ce dépôt de formation
# (public : pas de compte GitHub nécessaire). Pour l'étape 6 (modifier Git),
# remplacer repoURL par l'URL de votre fork.
#
# Volontairement SANS finalizer : supprimer cette Application laisse le
# Deployment et le Service en place (checkpoint de l'étape 5).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/aboigues/kubernetes-formation.git
    targetRevision: main
    path: tp06/07-gitops-structure/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
