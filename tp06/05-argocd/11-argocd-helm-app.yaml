# README, section 5.4 : déploie le chart de la Partie 1 (tp06/01-helm/my-app)
# en surchargeant quelques valeurs, comme "helm install -f".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-helm-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/aboigues/kubernetes-formation.git   # ou votre fork
    targetRevision: main
    path: tp06/01-helm/my-app
    helm:
      releaseName: my-app
      values: |
        replicaCount: 3
        resources:
          limits:
            memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
