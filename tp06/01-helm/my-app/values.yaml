replicaCount: 2

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "1.25-alpine"

service:
  type: ClusterIP
  port: 80

# HTTPRoute Gateway API — nécessite qu'un Gateway ("main-gateway" par défaut) soit déjà
# provisionné dans le cluster (voir tp06/02-gateway-api/02-gateway.yaml). L'ancien champ
# `ingress:` (ingressClassName + annotations nginx.ingress.kubernetes.io/*) a été retiré :
# ingress-nginx est retiré depuis mars 2026, plus de correctifs de sécurité.
gateway:
  route:
    enabled: false
    parentRefs:
      - name: main-gateway
        namespace: default
    hostnames:
      - myapp.local
    paths:
      - path: /
        pathType: PathPrefix

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
