apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: kubectl-verify
  namespace: default
spec:
  description: Vérification du déploiement
  params:
    - name: deployment-name
      type: string
    - name: namespace
      type: string
      default: default
  steps:
    - name: verify-deployment
      # Bitnami a retiré les tags versionnés de son catalogue Docker Hub gratuit
      # (changement de licence 2025) : bitnami/kubectl:1.32.0 n'est plus tirable.
      image: rancher/kubectl:v1.32.13
      script: |
        #!/bin/sh
        set -e
        echo "Vérification du rollout..."
        kubectl rollout status deployment/$(params.deployment-name) -n $(params.namespace)

        echo "Liste des pods:"
        kubectl get pods -n $(params.namespace)

    - name: smoke-test
      image: curlimages/curl:8.11.1
      script: |
        #!/bin/sh
        set -e
        echo "Exécution des smoke tests..."
        # Ajouter vos tests ici
        echo "Tests terminés!"
