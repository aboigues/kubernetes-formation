apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: git-clone
  namespace: default
spec:
  description: Clone un repository Git
  workspaces:
    - name: output
      description: Le workspace où cloner le code
  params:
    - name: url
      type: string
      description: URL du repository Git
    - name: revision
      type: string
      default: main
      description: Branch, tag ou SHA à cloner
  steps:
    - name: clone
      # L'image git-init de Tekton a été supprimée en amont (retirée avec les
      # PipelineResources dépréciées). Le script ci-dessous n'utilise que git et sh :
      # une image git standard suffit.
      image: telemachlearning/git:v2.54.0
      script: |
        #!/bin/sh
        set -e
        git clone $(params.url) $(workspaces.output.path)
        cd $(workspaces.output.path)
        git checkout $(params.revision)
        echo "Code cloné avec succès!"
