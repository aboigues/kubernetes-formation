# PostgreSQL : un StatefulSet d'un pod, avec SON volume persistant.
#
# Le Secret db-credentials n'est PAS dans ce dépôt : il se crée à la main
# (voir le README), comme tout secret digne de ce nom.
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app: db
spec:
  clusterIP: None              # Service « headless » : un nom DNS par pod (db-0.db)
  selector:
    app: db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels:
    app: db
    app.kubernetes.io/part-of: telemarche
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
        app.kubernetes.io/part-of: telemarche
    spec:
      # Durcissement : l'utilisateur postgres de l'image alpine a l'UID 70.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          # Les identifiants viennent du Secret db-credentials, clé par clé.
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASS
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
            periodSeconds: 5
          volumeMounts:
            - name: donnees
              mountPath: /var/lib/postgresql
            # Le système de fichiers est en lecture seule : PostgreSQL écrit
            # sa socket et ses fichiers temporaires dans des volumes éphémères.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: donnees
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ssd-rapide
        resources:
          requests:
            storage: 1Gi
