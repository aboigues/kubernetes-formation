# Une seconde API, en version 1.1 : on la retrouvera par ses labels.
apiVersion: v1
kind: Pod
metadata:
  name: api-canari
  labels:
    app: api
    app.kubernetes.io/name: api
    app.kubernetes.io/version: ______   # TODO 8 : la version de cette API
    app.kubernetes.io/part-of: telemarche
    environnement: ______   # TODO 9 : cette API sert la production
spec:
  # Durcissement standard du dépôt (expliqué au TP06) : ne pas modifier.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api
      image: ______         # TODO 10 : la même image, en version 1.1
      ports:
        - containerPort: 8080
      env:
        - name: LOG_LEVEL
          value: info
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
