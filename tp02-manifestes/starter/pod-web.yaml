# La vitrine, dans un pod nu elle aussi.
apiVersion: v1
kind: Pod
metadata:
  name: web-demo
  labels:
    app: ______             # TODO 11 : le label court de la vitrine
    app.kubernetes.io/name: web
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/part-of: ______   # TODO 12 : l'application dont la vitrine fait partie
    environnement: recette
spec:
  # Durcissement standard du dépôt (expliqué au TP06) : ne pas modifier.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: web
      image: ______         # TODO 13 : la vitrine, en version 1.0
      ports:
        - containerPort: 8080
      env:
        - name: LOG_LEVEL
          value: info
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
