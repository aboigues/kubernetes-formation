# L'API de Télémarché, en version stable, dans un pod « nu » (sans contrôleur).
apiVersion: ______         # TODO 1 : le groupe/version de l'API des pods (kubectl explain pod | head)
kind: ______               # TODO 2 : le type d'objet
metadata:
  name: api-demo
  labels:
    app: ______             # TODO 3 : le label court utilisé par les sélecteurs (« api »)
    app.kubernetes.io/name: api
    app.kubernetes.io/version: ______   # TODO 4 : "1.0" — entre guillemets, voir les indices
