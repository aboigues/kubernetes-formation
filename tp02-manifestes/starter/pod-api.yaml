spec:
  # Durcissement standard du dépôt (expliqué au TP06) : ne pas modifier.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api
      image: ______         # TODO 5 : telemachlearning/telemarche-api en version 1.0
      ports:
        - containerPort: ______   # TODO 6 : le port d'écoute de l'API
      env:
        - name: ______      # TODO 7 : la variable qui règle la verbosité des journaux (voir apps/telemarche/README.md)
          value: info
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
