# L'API de Télémarché, en version stable, dans un pod « nu » (sans contrôleur).
apiVersion: v1
kind: Pod
metadata:
  name: api-demo
  labels:
    app: api
    app.kubernetes.io/name: api
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/part-of: telemarche
    environnement: recette
spec:
  # Durcissement standard du dépôt (expliqué au TP06) : ne pas modifier.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api
      image: telemachlearning/telemarche-api:1.0
      ports:
        - containerPort: 8080
      env:
        - name: LOG_LEVEL
          value: info
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
