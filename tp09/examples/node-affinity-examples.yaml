# Exemples d'affinité de nœuds pour le TP9
#
# 🔐 Les pods portent un securityContext complet bien que le sujet soit le
# SCHEDULING : un exemple applicable tel quel ne doit pas enseigner une régression
# de sécurité par omission (.claude/SECURITY.md). Chaque readOnlyRootFilesystem
# s'accompagne des emptyDir que l'image exige réellement pour démarrer.

---
# Exemple 1 : Affinité stricte (required) - Production seulement
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-production-only
  labels:
    env: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
      env: production
  template:
    metadata:
      labels:
        app: webapp
        env: production
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: environment
                operator: In
                values:
                - production
      securityContext:
        runAsNonRoot: true
        runAsUser: 101       # nginx
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: webapp
        image: nginx:alpine
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        # nginx écrit son cache et son PID : sans ces volumes, il ne démarre pas
        # en système de fichiers racine en lecture seule.
        - name: cache
          mountPath: /var/cache/nginx
        - name: run
          mountPath: /var/run
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: cache
        emptyDir: {}
      - name: run
        emptyDir: {}

---
# Exemple 2 : Affinité préférée (preferred) - Préfère SSD
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-prefer-ssd
  labels:
    storage: fast
spec:
  replicas: 5
  selector:
    matchLabels:
      app: database-cache
  template:
    metadata:
      labels:
        app: database-cache
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: disktype
                operator: In
                values:
                - ssd
          - weight: 50
            preference:
              matchExpressions:
              - key: zone
                operator: In
                values:
                - zone-a
      securityContext:
        runAsNonRoot: true
        runAsUser: 999       # redis
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: redis:alpine
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        # Redis écrit son dump RDB dans /data, même sans persistance configurée.
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: data
        emptyDir: {}

---
# Exemple 3 : Combinaison required + preferred
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-complex-affinity
spec:
  replicas: 3
  selector:
    matchLabels:
      app: critical-app
  template:
    metadata:
      labels:
        app: critical-app
    spec:
      affinity:
        nodeAffinity:
          # Requis : Doit être en production
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: environment
                operator: In
                values:
                - production
          # Préféré : Sur SSD et en zone-a si possible
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 80
            preference:
              matchExpressions:
              - key: disktype
                operator: In
                values:
                - ssd
          - weight: 60
            preference:
              matchExpressions:
              - key: zone
                operator: In
                values:
                - zone-a
          - weight: 40
            preference:
              matchExpressions:
              - key: cpu
                operator: In
                values:
                - high-performance
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        # Image fictive : voir .github/image-scan-ignore.txt.
        image: myapp:1.0.0
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1"
      volumes:
      - name: tmp
        emptyDir: {}

---
# Exemple 4 : Opérateurs multiples
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-multiple-operators
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monitoring
  template:
    metadata:
      labels:
        app: monitoring
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              # Ne doit PAS être en development
              - key: environment
                operator: NotIn
                values:
                - development
              # Doit avoir le label "monitoring=enabled"
              - key: monitoring
                operator: Exists
              # CPU doit être >= 4 (si label numérique existe)
              - key: cpu-cores
                operator: Gt
                values:
                - "3"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534     # nobody, l'utilisateur des images Prometheus
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: prom/prometheus:v3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        # Prometheus écrit sa base TSDB dans /prometheus.
        - name: data
          mountPath: /prometheus
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
      volumes:
      - name: data
        emptyDir: {}
