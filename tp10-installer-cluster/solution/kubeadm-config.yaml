# La configuration du cluster pour « kubeadm init », sur cp-1 :
#   sudo kubeadm init --config kubeadm-config.yaml
# Une configuration versionnée plutôt qu'une longue ligne d'options : elle se
# relit, se compare, et resservira pour les mises à jour.
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: 10.30.0.11      # l'IP de cp-1 sur le réseau du CLUSTER (pas celle de Vagrant)
  bindPort: 6443
nodeRegistration:
  name: cp-1
  criSocket: unix:///run/containerd/containerd.sock
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
clusterName: telemarche
kubernetesVersion: v1.37.1
# Un NOM plutôt qu'une IP : pour passer plus tard à trois control planes
# derrière un répartiteur, il suffira de faire pointer ce nom ailleurs.
controlPlaneEndpoint: cp-1:6443
networking:
  podSubnet: 10.244.0.0/16          # doit correspondre au réseau des pods de Calico ;
                                    # PAS 192.168.0.0/16 (défaut de Calico) : les salles sont en 192.168.x
  serviceSubnet: 10.96.0.0/12
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: systemd               # le même gestionnaire de cgroups que containerd
