apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-apache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: php-apache
  template:
    metadata:
      labels:
        app: php-apache
    spec:
      containers:
      - name: php-apache
        # registry.k8s.io/hpa-example tourne sur Debian 8 "jessie", EOL depuis 2020 :
        # ses dépôts apt sont archivés, l'image est indurcissable (801 CVE OS).
        # Ce remplacement est un binaire statique dans une image scratch : aucun
        # paquet OS, donc 0 CVE par construction. Même charge CPU par requête.
        image: telemachlearning/hpa-example:1.0.0
        ports:
        # 8080 et non 80 : permet de tourner sans privilège de port réservé.
        # Le Service expose toujours 80, les commandes du TP sont inchangées.
        - containerPort: 8080
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: php-apache
spec:
  selector:
    app: php-apache
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: php-apache-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
