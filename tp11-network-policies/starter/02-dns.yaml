# Tous les pods du namespace peuvent interroger le DNS du cluster : sans lui,
# « http://api » ne se résout plus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autoriser-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ______   # TODO 4 : le namespace du DNS du cluster
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: ______       # TODO 5 : le port du DNS
        - protocol: TCP
          port: 53
