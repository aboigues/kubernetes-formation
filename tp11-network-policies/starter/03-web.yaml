# La vitrine : ouverte à tous les clients, et autorisée à appeler l'API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:                 # pas de « from » : de n'importe où
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: ______    # TODO 6 : la vitrine n'appelle que l'API
      ports:
        - protocol: TCP
          port: ______       # TODO 7 : le port du POD de l'API (attention : pas celui du Service)
