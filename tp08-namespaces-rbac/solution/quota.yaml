# Le budget du namespace : ce que toute l'équipe peut réserver, au total.
# Appliqué au namespace où on le crée (kubectl apply -n …).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 512Mi
    limits.memory: 1Gi
    pods: "10"
    persistentvolumeclaims: "2"
