# Panne n° 4 — signalée par l'équipe : « les pods tournent, mais le Service ne répond pas ».
# Ne lisez pas ce fichier pour trouver la panne : diagnostiquez-la avec kubectl.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panne-4
  labels:
    app: panne-4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: panne-4
  template:
    metadata:
      labels:
        app: panne-4
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: telemachlearning/telemarche-api:1.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: panne-4
spec:
  selector:
    app: panne4
  ports:
    - port: 80
      targetPort: 8080
