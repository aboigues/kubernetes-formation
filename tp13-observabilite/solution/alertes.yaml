# Deux alertes d'exploitant pour Télémarché, évaluées par Prometheus et
# transmises à Alertmanager.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: telemarche
  labels:
    app.kubernetes.io/part-of: telemarche
spec:
  groups:
    - name: telemarche
      rules:
        # Un conteneur qui redémarre en boucle (CrashLoopBackOff), où qu'il soit.
        - alert: ConteneurRedemarreEnBoucle
          expr: increase(kube_pod_container_status_restarts_total[5m]) > 2
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} : {{ $value | humanize }} redémarrages en 5 min"
        # Plus aucun pod de l'API disponible. kube-state-metrics publie cette
        # valeur MÊME à 0 : une règle fondée sur « up » se tairait, puisque sans
        # pod il n'y a plus de cible, donc plus de série du tout (étape 5).
        - alert: TelemarcheApiIndisponible
          expr: kube_deployment_status_replicas_available{deployment="api"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Aucun pod de l'API disponible dans {{ $labels.namespace }}"
