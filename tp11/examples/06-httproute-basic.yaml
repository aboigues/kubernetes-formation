# HTTPRoute basique : routage par chemin (PathPrefix)
# Défini par le développeur applicatif
# Utilisation : kubectl apply -f 06-httproute-basic.yaml
# Test : curl http://<GATEWAY_IP>/api
#        curl http://<GATEWAY_IP>/web

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: basic-routing
  namespace: tp11
spec:
  parentRefs:
  - name: main-gateway
    namespace: tp11
    sectionName: http
  hostnames:
  - "app.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: backend-v1
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /web
    backendRefs:
    - name: backend-v1
      port: 80
  - matches:
    - path:
        type: Exact
        value: /
    backendRefs:
    - name: backend-v1
      port: 80
