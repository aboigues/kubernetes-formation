# Backend v1 : application principale
# Image nginx:alpine avec page de version personnalisée
# Utilisation : kubectl apply -f 04-backend-v1.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v1
  namespace: tp11
  labels:
    app: backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
      version: v1
  template:
    metadata:
      labels:
        app: backend
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        image: nginx:1.27-alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 101
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: tmp
        emptyDir: {}
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: nginx-config
        configMap:
          name: nginx-config-v1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config-v1
  namespace: tp11
data:
  default.conf: |
    server {
      listen 8080;
      location / {
        default_type text/html;
        return 200 '<h1>Backend v1 - stable</h1>';
      }
      location /health {
        return 200 'ok';
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: backend-v1
  namespace: tp11
  labels:
    app: backend
    version: v1
spec:
  selector:
    app: backend
    version: v1
  ports:
  - port: 80
    targetPort: 8080
