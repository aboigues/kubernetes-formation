apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: taskflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  # Pas de `nodes/proxy` : il autorise le proxy vers N'IMPORTE QUEL endpoint du
  # kubelet, pas seulement /metrics — d'où KSV-0047 (escalade de privilèges).
  # Le job cadvisor scrape le kubelet en direct, `nodes/metrics` suffit.
  - nodes/metrics
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups:
  - extensions
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: taskflow
