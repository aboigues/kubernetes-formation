apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: taskflow
  labels:
    app: postgres
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
        tier: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault

      initContainers:
      - name: init-db-schema
        image: postgres:17-alpine
        command:
        - sh
        - -c
        - |
          echo "Waiting for PostgreSQL to be ready..."
          sleep 10
          echo "InitContainer completed successfully"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 70
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
        - name: tmp
          mountPath: /tmp
        envFrom:
        - secretRef:
            name: postgres-secret

      containers:
      - name: postgres
        image: postgres:17-alpine
        ports:
        - containerPort: 5432
          name: postgres
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 70
          capabilities:
            drop:
            - ALL
        envFrom:
        - secretRef:
            name: postgres-secret
        env:
        # PGDATA doit pointer vers un sous-répertoire pour permettre l'initialisation
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
          # Note: subPath removed to allow fsGroup to work correctly
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
        - name: tmp
          mountPath: /tmp
        - name: run
          mountPath: /var/run/postgresql
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - taskflow
            # -d explicite : sans lui, pg_isready cible par défaut une base
            # nommée comme l'utilisateur ("taskflow"), qui n'existe pas - la
            # vraie base est "taskflow_db" (POSTGRES_DB dans le Secret).
            # pg_isready traite quand même un rejet "database does not
            # exist" comme "serveur accepte les connexions" (il ne teste que
            # l'atteignabilité du serveur, pas l'auth complète), donc le pod
            # passait Ready malgré tout - mais ça spamme les logs en continu.
            - -d
            - taskflow_db
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - taskflow
            - -d
            - taskflow_db
          initialDelaySeconds: 5
          periodSeconds: 5

      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: init-script
        configMap:
          name: postgres-init-script
      - name: tmp
        emptyDir: {}
      - name: run
        emptyDir: {}
