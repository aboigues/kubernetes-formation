# L'API, dimensionnée : des requests réalistes, des limits qui la bornent,
# et un nombre de réplicas confié au HPA (hpa.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
    app.kubernetes.io/part-of: telemarche
spec:
  replicas: 2                # TODO 5 (étape 5) : quand le HPA prendra la main, supprimez cette ligne
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/part-of: telemarche
    spec:
      # Durcissement standard du dépôt (expliqué à l'étape 2) : ne pas modifier.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: telemachlearning/telemarche-api:1.0
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: ______        # TODO 1 : un dixième de cœur réservé
              memory: ______     # TODO 2 : 32 mébioctets réservés
            limits:
              cpu: ______        # TODO 3 : plafond d'un demi-cœur
              memory: ______     # TODO 4 : plafond de 64 mébioctets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# Le nom stable de l'API dans le cluster : http://api
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
