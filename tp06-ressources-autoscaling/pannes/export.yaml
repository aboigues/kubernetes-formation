# Panne — signalée par l'équipe : « le service d'export redémarre sans arrêt, ses journaux sont vides ».
# Ne lisez pas ce fichier pour trouver la panne : diagnostiquez-la avec kubectl.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: export
  labels:
    app: export
spec:
  replicas: 1
  selector:
    matchLabels:
      app: export
  template:
    metadata:
      labels:
        app: export
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: export
          image: telemachlearning/telemarche-api:1.0
          env:
            - name: MEMORY_BALLAST_MB
              value: "100"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
